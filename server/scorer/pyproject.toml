[project]
name = "jobfoundry-scorer"
version = "0.1.0"
description = "JobFoundry fit screener + tailoring bridge"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "litellm>=1.97.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "toons>=0.7.0",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

