name: jobfoundry

services:
  # JobFoundry All-in-One (Web Dashboard + Ingest API + Fit Scorer + Resume Tailor)
  jobfoundry:
    image: ghcr.io/rat-s/jobfoundry:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    env_file:
      - .env
    volumes:
      - jobfoundry-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  jobfoundry-data:
