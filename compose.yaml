name: jobfoundry

# Phase 00 skeleton — parse/validate only, NOT runnable yet.
# Services are wired into a real stack in Phase 08. Each service lists the
# phase that builds it.

services:
  # Phase 01/08 — server/ingest (Node/ESM ingest API + SQLite + dedup)
  ingest:
    build: ./server/ingest
    environment:
      PORT: '8080'
      DB_PATH: /data/jobfoundry.db
      API_KEYS: ${API_KEYS:?set API_KEYS in .env}
    volumes:
      - jobfoundry-data:/data

  # Phase 05/08 — server/scorer (Python fit screener + tailoring bridge)
  scorer:
    build: ./server/scorer
    environment:
      DB_PATH: /data/jobfoundry.db
      SCORER_MODEL: ${SCORER_MODEL:-}
      SCORER_PROVIDER: ${SCORER_PROVIDER:-}
      SCORER_THRESHOLD: ${SCORER_THRESHOLD:-75}
      RESUME_OPS_URL: http://resume-ops:8081
    volumes:
      - jobfoundry-data:/data

  # Phase 06/08 — external tailoring engine (resume-ops), image TBD in Phase 08
  resume-ops:
    image: resume-ops:local
    environment:
      PORT: '8081'

  # Phase 07/08 — server/web (Vite + React dashboard)
  web:
    build: ./server/web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - '5173:5173'
    depends_on:
      - ingest
      - scorer

volumes:
  jobfoundry-data:
