[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:gatepass]
directory=/data
command=/usr/local/bin/gatepass
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PROXY_TARGET_URL="https://openrouter.ai/api/v1",PROXY_PORT="8318",RATE_LIMIT_RPM="20",RATE_LIMIT_BURST="2",PROXY_LOGS_DB="/data/gatepass.db"
priority=5

[program:tailor]
directory=/app/server/tailor
command=python -m resume_ops_api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="8081",DATA_DIR="%(ENV_DATA_DIR)s",MASTER_RESUME_PATH="%(ENV_MASTER_RESUME_PATH)s",DEFAULT_MODEL="%(ENV_TAILOR_MODEL)s",OPENAI_API_KEY="%(ENV_OPENAI_API_KEY)s",OPENROUTER_API_KEY="%(ENV_OPENROUTER_API_KEY)s",OPENROUTER_API_BASE="http://127.0.0.1:8318",OPENAI_API_BASE="http://127.0.0.1:8318",OPENAI_BASE_URL="http://127.0.0.1:8318",LLM_RATE_LIMIT_REQUESTS="%(ENV_LLM_RATE_LIMIT_REQUESTS)s",LLM_RATE_LIMIT_PERIOD="%(ENV_LLM_RATE_LIMIT_PERIOD)s",LLM_MAX_CONCURRENCY="1",LLM_MAX_RETRIES="%(ENV_LLM_MAX_RETRIES)s",LLM_RETRY_MIN_WAIT_SECONDS="%(ENV_LLM_RETRY_MIN_WAIT_SECONDS)s",LLM_RETRY_MAX_WAIT_SECONDS="%(ENV_LLM_RETRY_MAX_WAIT_SECONDS)s",LLM_RETRY_MULTIPLIER="%(ENV_LLM_RETRY_MULTIPLIER)s"
priority=10

[program:scorer]
directory=/app/server/scorer
command=python -m src.main
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="8001",DB_PATH="%(ENV_DB_PATH)s",ARTIFACTS_DIR="%(ENV_ARTIFACTS_DIR)s",SCORER_MODEL="%(ENV_SCORER_MODEL)s",SCORER_PROVIDER="%(ENV_SCORER_PROVIDER)s",SCORER_THRESHOLD="%(ENV_SCORER_THRESHOLD)s",OPENROUTER_API_BASE="http://127.0.0.1:8318",OPENAI_BASE_URL="http://127.0.0.1:8318",RESUME_OPS_URL="http://127.0.0.1:8081"
priority=20

[program:ingest]
directory=/app
command=node server/ingest/src/index.mjs
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="8080",DB_PATH="%(ENV_DB_PATH)s",ARTIFACTS_DIR="%(ENV_ARTIFACTS_DIR)s",STATIC_DIR="/app/server/web/dist",API_KEYS="%(ENV_API_KEYS)s",RESUME_OPS_URL="http://127.0.0.1:8081"
priority=30
