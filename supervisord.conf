[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:tailor]
directory=/app/server/tailor
command=python -m resume_ops_api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="8081",DATA_DIR="%(ENV_DATA_DIR)s",MASTER_RESUME_PATH="%(ENV_MASTER_RESUME_PATH)s",DEFAULT_MODEL="%(ENV_TAILOR_MODEL)s",ALLOWED_THEMES="%(ENV_ALLOWED_THEMES)s"
priority=10

[program:scorer]
directory=/app/server/scorer
command=python -m src.main
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="8001",DB_PATH="%(ENV_DB_PATH)s",ARTIFACTS_DIR="%(ENV_ARTIFACTS_DIR)s",SCORER_MODEL="%(ENV_SCORER_MODEL)s",SCORER_PROVIDER="%(ENV_SCORER_PROVIDER)s",SCORER_THRESHOLD="%(ENV_SCORER_THRESHOLD)s",RESUME_OPS_URL="http://127.0.0.1:8081"
priority=20

[program:ingest]
directory=/app
command=node server/ingest/src/index.mjs
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="8080",DB_PATH="%(ENV_DB_PATH)s",ARTIFACTS_DIR="%(ENV_ARTIFACTS_DIR)s",STATIC_DIR="/app/server/web/dist",API_KEYS="%(ENV_API_KEYS)s"
priority=30
