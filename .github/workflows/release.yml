name: Release Extension Bundles

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint and extension tests
        run: |
          npm run lint
          npm --workspace=extension test

      - name: Build and Package Browser Extensions
        run: |
          npm --workspace=extension run zip
          npm --workspace=extension run zip:firefox
          mkdir -p dist-extension
          cp -f extension/.output/*.zip dist-extension/ 2>/dev/null || true
          cp -f .output/*.zip dist-extension/ 2>/dev/null || true
          for f in dist-extension/*-[0-9]*.*.zip; do
            [ -f "$f" ] || continue
            mv -f "$f" "$(echo "$f" | sed -E 's/-[0-9]+\.[0-9]+(\.[0-9]+)?//')"
          done
          ls -lh dist-extension/

      - name: Upload Extension Artifacts (CI)
        uses: actions/upload-artifact@v7
        with:
          name: extension-bundles
          path: dist-extension/*.zip

      - name: Attach Extension Zips to Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-extension/*.zip

  build-appimage:
    runs-on: ubuntu-24.04
    container: almalinux:10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build prerequisites
        run: |
          dnf -q -y install file unzip xz

      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh

      - name: Upload AppImage (CI)
        uses: actions/upload-artifact@v7
        with:
          name: jobfoundry-appimage
          path: build/appimage/output/*.AppImage

      - name: Attach AppImage to Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/appimage/output/*.AppImage
