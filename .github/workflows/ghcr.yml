# Build and publish JobFoundry service images to GHCR
name: Publish Container Images (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingest
            context: .
            dockerfile: server/ingest/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/jobfoundry-ingest

          - service: scorer
            context: .
            dockerfile: server/scorer/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/jobfoundry-scorer

          - service: tailor
            context: server/tailor
            dockerfile: server/tailor/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/jobfoundry-tailor

          - service: web
            context: .
            dockerfile: server/web/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/jobfoundry-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
