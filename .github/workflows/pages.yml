name: Deploy GitHub Pages

# The docs site (site/) is built fresh on every deploy and uploaded as an
# artifact. Build output is never committed — see .gitignore (/docs/).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs site
        # Custom domain (CNAME: jobfoundry.covai.org) serves at root, so the
        # default base '/' applies. If these Pages ever move back to the
        # project subpath, set ASTRO_BASE: '/JobFoundry/' here
        # (astro.config.mjs reads it).
        run: npm run site:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
