name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
        working-directory: server/scorer
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  python:
    name: Python scorer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/scorer
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run pytest
