<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | JobFoundry</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background-color: #0b111e;
        font-family:
          'Outfit',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      body::before {
        content: '';
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.15), transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 0;
      }
      .container {
        max-width: 540px;
        width: 100%;
        background: rgba(19, 30, 49, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 24px;
        padding: 48px 36px;
        text-align: center;
        backdrop-filter: blur(16px);
        position: relative;
        z-index: 1;
      }
      .code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 5rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        color: #94a3b8;
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        padding: 12px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 0.95rem;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: #38bdf8;
        color: #0f172a;
      }
      .btn-primary:hover {
        background: #7dd3fc;
        transform: translateY(-2px);
      }
      .btn-secondary {
        background: rgba(148, 163, 184, 0.1);
        color: #f8fafc;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .btn-secondary:hover {
        background: rgba(148, 163, 184, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <h1>Job Posting Not Found</h1>
      <p>
        The documentation page or resource you are looking for does not exist or has been moved.
      </p>
      <div class="actions">
        <a href="index.html" class="btn btn-primary">Return to Home</a>
        <a href="welcome.html" class="btn btn-secondary">Getting Started Guide</a>
      </div>
    </div>
  </body>
</html>
