<!doctype html>
<html lang="en">
  <head>
    <script defer src="https://covai.org/analytics.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uninstall Feedback - JobFoundry</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background-color: #0b111e;
        font-family:
          'Outfit',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 600px;
        width: 100%;
        background: rgba(19, 30, 49, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 20px;
        padding: 36px;
        text-align: center;
        backdrop-filter: blur(16px);
      }
      .emoji {
        font-size: 48px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        color: #94a3b8;
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 10px;
        text-decoration: none;
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }
      .btn:hover {
        background: #7dd3fc;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">👋</div>
      <h1>We're sorry to see you go</h1>
      <p>
        Thank you for trying out the JobFoundry extension. We're actively building and refining the
        pipeline. If something broke or didn't work as expected, we would love your input!
      </p>
      <a
        href="https://github.com/deadrat-in/JobFoundry/issues"
        target="_blank"
        rel="noopener"
        class="btn"
      >
        Share feedback on GitHub &rarr;
      </a>
    </div>
  </body>
</html>
