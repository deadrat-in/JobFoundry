<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobFoundry</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <div class="popup-header">
        <h1>⚡ JobFoundry</h1>
        <button id="auto-connect" type="button" class="btn-connect" title="Auto-detect credentials from open JobFoundry dashboard tab">
          🔗 1-Click Auto-Connect
        </button>
      </div>

      <form id="settings">
        <label class="field">
          <span>Server URL</span>
          <input
            id="server-url"
            type="url"
            placeholder="http://localhost:8080"
            autocomplete="off"
          />
        </label>
        <label class="field">
          <span>API key</span>
          <input id="api-key" type="password" placeholder="ingest API key" autocomplete="off" />
        </label>
        <label class="field">
          <span>Scan interval (hours)</span>
          <input id="scan-interval" type="number" min="1" step="1" />
        </label>
        <label class="check">
          <input id="passive-mode" type="checkbox" />
          <span>Passive browsing capture</span>
        </label>
        <label class="check">
          <input id="active-mode" type="checkbox" />
          <span>Active mode</span>
        </label>
        <label class="field">
          <span>Fit threshold (0-100)</span>
          <input id="fit-threshold" type="number" min="0" max="100" step="1" />
        </label>
        <div class="actions">
          <button id="capture-tab" type="button" class="btn-primary">Capture Tab</button>
          <button id="scan-now" type="button" class="btn-secondary">Scan Portals</button>
          <button id="save" type="submit" class="btn-save">Save</button>
        </div>
      </form>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
