<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobFoundry Sidebar</title>
    <link rel="stylesheet" href="../popup/popup.css" />
  </head>
  <body>
    <main class="popup sidepanel">
      <!-- Header -->
      <div class="popup-header">
        <div class="brand">
          <img src="/icons/logo.webp" alt="JobFoundry Logo" class="brand-icon brand-logo" />
          <span class="brand-title">JobFoundry</span>
        </div>
        <span id="popup-conn-badge" class="badge badge-disconnected">Checking...</span>
      </div>

      <!-- Disconnected Notice (only shown if not paired) -->
      <div id="unpaired-box" class="unpaired-box" style="display: none">
        <p>Extension not connected to your dashboard.</p>
        <button id="auto-connect" type="button" class="btn btn-connect">
          ⚡ 1-Click Auto-Connect
        </button>
      </div>

      <!-- Connected Info -->
      <div id="paired-box" class="paired-box" style="display: none">
        <div class="user-row">
          <span id="user-email" class="user-email">user@domain.com</span>
          <button
            id="reconnect-btn"
            type="button"
            class="btn-icon"
            title="Reconnect / Refresh sync with open dashboard tab"
          >
            🔄 Reconnect
          </button>
        </div>
        <div class="user-subrow">
          <span id="active-scrapers-count" class="scrapers-count">6 scrapers active</span>
        </div>
      </div>

      <!-- Primary Action Buttons -->
      <div class="main-actions">
        <button id="capture-tab" type="button" class="btn btn-primary">
          🎯 Capture Current Page
        </button>
        <button id="scan-now" type="button" class="btn btn-secondary">🚀 Scan Portals Now</button>
      </div>

      <!-- Quick Toggles -->
      <div class="toggles-list">
        <label class="toggle-row">
          <span>Passive browsing capture</span>
          <input id="passive-mode" type="checkbox" />
        </label>
        <label class="toggle-row">
          <span>Scheduled background scan</span>
          <input id="active-mode" type="checkbox" />
        </label>
      </div>

      <!-- Live Status Output -->
      <div id="status" class="status-msg" role="status">Ready</div>

      <!-- Footer Navigation -->
      <footer class="popup-footer">
        <button id="open-options" type="button" class="footer-link">⚙️ Filters & Scrapers</button>
        <button id="open-dashboard" type="button" class="footer-link">🌐 Dashboard</button>
      </footer>
    </main>

    <script type="module" src="../popup/main.ts"></script>
  </body>
</html>
